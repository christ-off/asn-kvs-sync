AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ASN KVS sync - daily job that syncs the full ASN -> category list
  into a CloudFront KeyValueStore read by the traffic filter function.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 900
    MemorySize: 2048

Resources:
  AsnKeyValueStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: asn-categories
      Comment: ASN -> category (isp, hosting, business, ...) for the traffic filter function

  SyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SyncFunction}'
      RetentionInDays: 30

  # Own role: KeyValueStore write only, no website-bucket, logs or invalidation rights.
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: .
      Description: Sync the full ASN -> category list into the CloudFront KeyValueStore
      Environment:
        Variables:
          KVS_ARN: !GetAtt AsnKeyValueStore.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront-keyvaluestore:DescribeKeyValueStore
                - cloudfront-keyvaluestore:ListKeys
                - cloudfront-keyvaluestore:GetKey
                - cloudfront-keyvaluestore:PutKey
                - cloudfront-keyvaluestore:DeleteKey
                - cloudfront-keyvaluestore:UpdateKeys
              Resource: !GetAtt AsnKeyValueStore.Arn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 4 ? * MON *)
            Description: Sync the ASN list weekly, Monday 04:00 UTC
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: false
        # CJS code inside the AWS SDK needs require(), which an ESM bundle lacks
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        EntryPoints:
          - src/handler.mjs
        OutExtension:
          - .js=.mjs

Outputs:
  KeyValueStoreArn:
    Description: KeyValueStore ARN (to associate with the CloudFront Function)
    Value: !GetAtt AsnKeyValueStore.Arn
  FunctionName:
    Description: Lambda function name (for manual invocation)
    Value: !Ref SyncFunction
